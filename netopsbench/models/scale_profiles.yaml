schema_version: "1"
profiles:
  - name: xs
    topology: {family: clos, spines: 2, leafs: 2, clients_per_leaf: 1}
    management: {prefix: 24, subnet_base: 100}
    pingmesh: {destination_batch_size: null, rtt_port_pool_size: 16, rtt_ports_per_cycle: 8, cycle_interval_seconds: 1}
    traffic: {max_pps_per_client: 250}
    runtime: {deploy_timeout_seconds: 1800, worker_deploy_parallelism: 2, health_timeout_seconds: 60}
  - name: small
    topology: {family: clos, spines: 2, leafs: 4, clients_per_leaf: 2}
    management: {prefix: 24, subnet_base: 120}
    pingmesh: {destination_batch_size: null, rtt_port_pool_size: 16, rtt_ports_per_cycle: 8, cycle_interval_seconds: 1}
    traffic: {max_pps_per_client: 250}
    runtime: {deploy_timeout_seconds: 1800, worker_deploy_parallelism: 2, health_timeout_seconds: 60}
  - name: medium
    topology: {family: clos, spines: 4, leafs: 8, clients_per_leaf: 2}
    management: {prefix: 24, subnet_base: 140}
    pingmesh: {destination_batch_size: null, rtt_port_pool_size: 16, rtt_ports_per_cycle: 6, cycle_interval_seconds: 1}
    traffic: {max_pps_per_client: 200}
    runtime: {deploy_timeout_seconds: 1800, worker_deploy_parallelism: 2, health_timeout_seconds: 60}
  - name: large
    topology: {family: clos, spines: 4, leafs: 16, clients_per_leaf: 4}
    management: {prefix: 24, subnet_base: 160}
    pingmesh: {destination_batch_size: 16, rtt_port_pool_size: 16, rtt_ports_per_cycle: 4, cycle_interval_seconds: 3}
    traffic: {max_pps_per_client: 100}
    runtime: {deploy_timeout_seconds: 2700, worker_deploy_parallelism: 1, health_timeout_seconds: 180, containerlab_max_workers: 16}
  - name: xlarge
    topology: {family: clos, spines: 16, leafs: 128, clients_per_leaf: 1}
    management: {prefix: 23, subnet_base: 180}
    pingmesh: {destination_batch_size: 16, rtt_port_pool_size: 16, rtt_ports_per_cycle: 4, cycle_interval_seconds: 3}
    traffic: {max_pps_per_client: 100}
    runtime: {deploy_timeout_seconds: 3600, worker_deploy_parallelism: 1, health_timeout_seconds: 240, containerlab_max_workers: 16}
  - name: fat-tree-k8
    topology: {family: fat-tree, k: 8, clients_per_edge: 4}
    management: {prefix: 24, subnet_base: 200}
    pingmesh: {destination_batch_size: 16, rtt_port_pool_size: 16, rtt_ports_per_cycle: 4, cycle_interval_seconds: 3}
    traffic: {max_pps_per_client: 100}
    runtime: {deploy_timeout_seconds: 3600, worker_deploy_parallelism: 1, health_timeout_seconds: 240, containerlab_max_workers: 1}
  - name: fat-tree-k12
    topology: {family: fat-tree, k: 12, clients_per_edge: 2}
    management: {prefix: 23, subnet_base: 220}
    pingmesh: {destination_batch_size: 16, rtt_port_pool_size: 16, rtt_ports_per_cycle: 4, cycle_interval_seconds: 3}
    traffic: {max_pps_per_client: 50}
    runtime: {deploy_timeout_seconds: 5400, worker_deploy_parallelism: 1, health_timeout_seconds: 300, containerlab_max_workers: 1}
