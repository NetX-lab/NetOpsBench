version: v1

defaults:
  traffic_profile: standard
  count_per_fault: 4
  fault_duration_seconds: 30
  fault_stabilization_seconds: 5

fault_templates:
  # Access link failures remain the easy anchor. Larger topologies also cover
  # both ends of redundant fabric links.
  - name: link_down_access
    fault_type: link_down
    difficulty: easy
    device_role: leaf
    interface_role: downlink
    fault_stabilization_seconds: 5
    count_per_scale:
      xs: 1
      small: 1
      medium: 2
      large: 4
      xlarge: 2
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: link_down_leaf_fabric
    fault_type: link_down
    difficulty: medium
    device_role: leaf
    interface_role: uplink
    count: 0
    count_per_scale:
      xlarge: 2
      fat-tree-k8: 1
      fat-tree-k12: 1

  - name: link_down_spine_fabric
    fault_type: link_down
    difficulty: hard
    device_role: spine
    count: 0
    count_per_scale:
      xlarge: 2
      fat-tree-k8: 0
      fat-tree-k12: 0

  - name: link_down_agg_edge
    fault_type: link_down
    difficulty: medium
    device_role: agg
    interface_role: downlink
    count: 0
    count_per_scale:
      fat-tree-k8: 1
      fat-tree-k12: 1

  - name: link_down_agg_core
    fault_type: link_down
    difficulty: hard
    device_role: agg
    interface_role: uplink
    count: 0
    count_per_scale:
      fat-tree-k8: 1
      fat-tree-k12: 1

  - name: link_down_core_agg
    fault_type: link_down
    difficulty: hard
    device_role: core
    count: 0
    count_per_scale:
      fat-tree-k8: 1
      fat-tree-k12: 1

  - name: blackhole_route_leaf
    fault_type: blackhole_route
    difficulty: medium
    device_role: leaf
    count_per_scale:
      xs: 1
      small: 1
      medium: 2
      large: 4
      xlarge: 3
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: blackhole_route_spine
    fault_type: blackhole_route
    difficulty: hard
    device_role: spine
    count: 0
    count_per_scale:
      xlarge: 3

  - name: blackhole_route_agg
    fault_type: blackhole_route
    difficulty: hard
    device_role: agg
    count: 0
    count_per_scale:
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: blackhole_route_core
    fault_type: blackhole_route
    difficulty: hard
    device_role: core
    count: 0
    count_per_scale:
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: mtu_mismatch_spine
    fault_type: mtu_mismatch
    difficulty: hard
    device_role: spine
    mtu: 1400
    count_per_scale:
      xs: 1
      small: 1
      medium: 2
      large: 4
      xlarge: 3
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: mtu_mismatch_leaf
    fault_type: mtu_mismatch
    difficulty: hard
    device_role: leaf
    interface_role: uplink
    mtu: 1400
    count: 0
    count_per_scale:
      xlarge: 3
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: mtu_mismatch_agg
    fault_type: mtu_mismatch
    difficulty: hard
    device_role: agg
    interface_role: uplink
    mtu: 1400
    count: 0
    count_per_scale:
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: high_latency_leaf
    fault_type: high_latency
    difficulty: medium
    device_role: leaf
    interface_role: uplink
    latency_ms: 120
    count_per_scale:
      xs: 1
      small: 1
      medium: 2
      large: 4
      xlarge: 3
      fat-tree-k8: 2
      fat-tree-k12: 2

  - name: high_latency_spine
