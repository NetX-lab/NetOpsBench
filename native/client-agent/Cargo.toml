[package]
name = "netopsbench-client-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
blake2 = "=0.10.6"
clap = { version = "=4.6.4", features = ["derive"] }
libc = "=0.2.189"
nix = { version = "=0.30.1", features = ["net", "socket", "time", "uio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
socket2 = { version = "=0.6.5", features = ["all"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
